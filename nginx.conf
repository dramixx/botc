server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # add_header is not inherited once a location defines its own, hence the repetition.

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Live relay (server/live.mjs, started next to nginx). Works in a sub-folder too.
  # Server-Sent Events: no buffering, long-lived connections.
  location ~ ^(?:/.*)?(/api/live(?:/.*)?)$ {
    proxy_pass http://127.0.0.1:8081$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    client_max_body_size 64k;
    add_header Cache-Control "no-store";
  }

  # Hashed build assets never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
    try_files $uri =404;
  }

  # Entry points are always revalidated so new versions are picked up.
  location ~ ^/(index\.html|sw\.js)$ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
  }

  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Unknown paths fall back to the app.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    try_files $uri $uri/ /index.html;
  }
}
