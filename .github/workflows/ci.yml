name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Version bumped
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: package.json version differs from the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! git cat-file -e "origin/$BASE_REF:package.json" 2>/dev/null; then
            echo "No package.json on the base branch yet (initial import): nothing to compare."
            exit 0
          fi
          head=$(node -p "require('./package.json').version")
          base=$(git show "origin/$BASE_REF:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          echo "base $base → PR $head"
          if [ "$head" = "$base" ]; then
            echo "::error file=package.json::Bump the version (shown at the bottom of the app) in every PR."
            exit 1
          fi

  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: botc-grimoire-dist
          path: dist
          retention-days: 14
